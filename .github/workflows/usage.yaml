name: 📅 Schedule Workflow Dispatch
on:
  # Polls for due schedules. Without this the dispatch path only runs when a human
  # triggers it, which is how a total scheduling outage went unnoticed for months.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to run the workflow'
        required: true
        type: string
        default: 'in 1 hour'
      workflow:
        description: 'Workflow to run at schedule time'
        type: choice
        default: 'basic.yml'
        options:
          - 'basic.yml'
          - 'codeql.yml'
concurrency:
  group: schedule${{ github.event.inputs.date }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schedule:
    name: 📅 Schedule
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - uses: actions/checkout@v7
      - uses: ./
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          workflow: ${{ inputs.workflow }}
          inputs: ${{ toJson(inputs)}}
          inputs-ignore: date,workflow
