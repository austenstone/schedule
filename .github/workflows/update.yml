name: Auto Update Dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npx npm-check-updates -u --target minor
      - run: npm i --legacy-peer-deps
      - run: npm audit fix || true

      # This job commits straight to main, so gate it on the full suite.
      # An unattended bad bump would otherwise ship a broken dist/ to consumers.
      - run: npm run lint
      - run: npm test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
