name: Probe vars gate (temporary)
on:
  push:
    branches: [austenstone-optimize-schedule-actions]
permissions: {}
jobs:
  no-schedules-skips:
    if: contains(toJSON(vars), '"_SCHEDULE_')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "should not run"
  existing-var-runs:
    if: contains(toJSON(vars), '"APP_ID"')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "vars keys are visible to job-level if"
