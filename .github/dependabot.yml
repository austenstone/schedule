# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    # @actions/core and @actions/github v3+ are ESM-only with no `exports.require`,
    # and ncc (webpack) emits require() into ESM. See vercel/ncc#1163. Unblocking
    # these means swapping the bundler to esbuild first.
    # TypeScript 7 is the native Go port; its programmatic compiler API isn't stable
    # until 7.1, so ts-jest, ts-node-dev and typescript-eslint (peer `<6.1.0`) break.
    # PR #94 was closed for this reason.
    ignore:
      - dependency-name: "@actions/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@actions/github"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
